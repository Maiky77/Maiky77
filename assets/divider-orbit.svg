<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46" viewBox="0 0 900 46" role="img" aria-label="Animated orbit divider">
  <defs>
    <linearGradient id="orbit-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="orbit-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M42 23 H410 M490 23 H858" stroke="url(#orbit-line)" stroke-width="1.4" stroke-dasharray="4 9">
    <animate attributeName="stroke-dashoffset" values="0;52" dur="5.2s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(450 23)" fill="none">
    <circle r="5" fill="#22d3ee" filter="url(#orbit-glow)">
      <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="33" ry="10" stroke="#2dd4bf" stroke-opacity="0.55" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="-16" to="344" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="25" ry="14" stroke="#8b5cf6" stroke-opacity="0.5" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="24" to="384" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="31" cy="-6" r="2.3" fill="#a78bfa" filter="url(#orbit-glow)"/>
  </g>
</svg>
