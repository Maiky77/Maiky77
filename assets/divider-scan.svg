<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42" role="img" aria-label="Animated data scan divider">
  <defs>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="0.72" stop-color="#8b5cf6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="scan-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M42 21 H858" stroke="#30363d" stroke-width="1"/>
  <path d="M42 21 H858" stroke="url(#scan-gradient)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 11">
    <animate attributeName="stroke-dashoffset" values="64;0" dur="4.5s" repeatCount="indefinite"/>
  </path>
  <g fill="#22d3ee" filter="url(#scan-glow)">
    <circle r="3">
      <animateMotion path="M42 21 H858" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#8b949e" opacity="0.55">
    <rect x="42" y="17" width="1" height="8"/><rect x="858" y="17" width="1" height="8"/>
    <circle cx="238" cy="21" r="1.6"/><circle cx="662" cy="21" r="1.6"/>
  </g>
</svg>
